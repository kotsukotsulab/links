<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>まとめページ</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
         line-height: 1.75; color: #1c1c1a; background: #fbfaf7; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 48px 20px; }
  h1 { font-size: 22px; margin: 0 0 20px; }
  a.item { display: block; background: #fff; border: 1px solid #e2e0d9; border-radius: 10px;
           padding: 16px 18px; margin: 12px 0; text-decoration: none; color: inherit; }
  a.item:hover { border-color: #c5c1b4; }
  .name { font-weight: 600; margin-bottom: 4px; }
  .desc { font-size: 14px; color: #57554e; }
  .note { font-size: 13px; color: #7a776e; margin-top: 32px; }
  @media (prefers-color-scheme: dark) {
    body { background: #17171a; color: #e8e7e3; }
    a.item { background: #1f1f24; border-color: #34333a; }
    .desc, .note { color: #a9a7a0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>まとめページ</h1>

  <a class="item" href="./ai/">
    <div class="name">AI時短ラボ</div>
    <div class="desc">仕事を減らすために使っているAIツールと本</div>
  </a>

  <a class="item" href="./money/">
    <div class="name">月1回だけの家計管理</div>
    <div class="desc">家計の棚卸しに使っているシートとサービス</div>
  </a>

  <p class="note">各ページはアフィリエイト広告を利用しています。</p>
</div>
</body>
</html>
